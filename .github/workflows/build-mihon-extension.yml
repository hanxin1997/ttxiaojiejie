name: Build Mihon 1.6 Extension

on:
  workflow_dispatch:
  push:
    paths:
      - "mihon/keiyoushi-module/**"
      - "mihon/signingkey.p12"
      - ".github/workflows/build-mihon-extension.yml"
  pull_request:
    paths:
      - "mihon/keiyoushi-module/**"
      - "mihon/signingkey.p12"
      - ".github/workflows/build-mihon-extension.yml"

permissions:
  contents: read

env:
  KEIYOUSHI_COMMIT: 5083ff5d06b9cb7736216ae0fbd0be3828bcce2c
  KEIYOUSHI_MODULE: src/all/folderlibrary
  # mihon/signingkey.p12 里那张证书的 SHA-256 指纹。换密钥就必须同步改这里——
  # 签名身份静默变化会让 Android 拒绝覆盖安装，那种失败必须在 CI 里炸出来。
  SIGNING_CERT_SHA256: 70a409d14b8f6d9a7863571d6c16479d06a4c14f87852bf27341d27d2990b1f8

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned Keiyoushi build base
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.KEIYOUSHI_COMMIT }}
          path: .keiyoushi-base

      - name: Verify pinned build base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git -C '.keiyoushi-base' rev-parse HEAD
          if ($actual -ne $env:KEIYOUSHI_COMMIT) {
            throw "Expected Keiyoushi $env:KEIYOUSHI_COMMIT but checked out $actual"
          }

          # 签名完全交给底座，所以它选签名配置的方式就是这条流水线的依赖项。
          # 底座换掉这个判断，就该在这里炸掉，而不是静默产出 Mihon 装不上的未签名包。
          $pluginText = Get-Content -Raw -Encoding UTF8 `
            -LiteralPath '.keiyoushi-base/gradle/build-logic/src/main/kotlin/ExtensionPlugin.kt'
          if ($pluginText -notmatch 'rootProject\.file\("signingkey\.jks"\)\.exists\(\)') {
            throw 'Pinned Keiyoushi no longer selects the signing config from signingkey.jks'
          }
          foreach ($name in @('KEY_STORE_PASSWORD', 'ALIAS', 'KEY_PASSWORD')) {
            if ($pluginText -notmatch "environmentVariable\(`"$name`"\)") {
              throw "Pinned Keiyoushi no longer reads the signing credential $name from the environment"
            }
          }

      - name: Install Folder Library module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $PWD ".keiyoushi-base/$env:KEIYOUSHI_MODULE"
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          # 底座在 Gradle 构建期就签名：ExtensionPlugin 用 rootProject.file("signingkey.jks")
          # 的存在与否选 release/debug 签名配置，所以密钥必须在跑 Gradle 之前放到底座根目录。
          # 后缀是 .jks 但内容是 PKCS12：底座的 SignExtensionJarTask 按 JKS→PKCS12 依次试，
          # AGP 走 KeyStore.getDefaultType()（JDK 17 = pkcs12），两条路都不看文件后缀。
          Copy-Item -LiteralPath 'mihon/signingkey.p12' -Destination '.keiyoushi-base/signingkey.jks' -Force

          # 官方 core 图标作为本地源的轻量默认图标，避免为低配模块增加额外资源。
          Copy-Item -Path '.keiyoushi-base/core/src/main/res' -Destination (Join-Path $target 'res') -Recurse -Force
          Copy-Item -Path 'mihon/keiyoushi-module/*' -Destination $target -Recurse -Force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Spotless, MockWebServer tests and release build
        shell: pwsh
        env:
          # 名字由底座定死（ExtensionPlugin 的 signingConfigs.create("release") 用
          # providers.environmentVariable 读这三个），不能改成别的。
          # 口令不是机密：密钥本身就随仓库走，这是个人局域网自签名，只为拿到稳定的签名身份。
          ALIAS: folderlibrary
          KEY_STORE_PASSWORD: folderlibrary
          KEY_PASSWORD: folderlibrary
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # spotlessCheck 必须显式列出：spotless 插件只把它挂到 check 上，而这里跑的
          # testDebugUnitTest / assembleRelease 都不经过 check，漏掉就等于不检查格式。
          # 排在最前面，格式问题能在漫长的编译之前先报出来。
          $gradlew = Join-Path $PWD '.keiyoushi-base/gradlew'
          $log = & $gradlew -p '.keiyoushi-base' --no-daemon `
            ':src:all:folderlibrary:spotlessCheck' `
            ':src:all:folderlibrary:testDebugUnitTest' `
            ':src:all:folderlibrary:assembleRelease' 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -eq 0) { exit 0 }

          # job log 匿名不可读，失败详情只能走 annotation 带出来。
          # annotation 只有 4096 字符预算。按 XML 结构提取每个用例的类型/消息和自家栈帧，
          # 而不是 grep 出成片上下文——否则一个用例的协程栈就能把其余失败全挤掉。
          function Get-TestFailureSummary($resultsDir) {
            if (-not (Test-Path -LiteralPath $resultsDir)) { return '' }
            $lines = foreach ($file in Get-ChildItem -LiteralPath $resultsDir -Filter '*.xml' -Recurse) {
              foreach ($case in ([xml](Get-Content -LiteralPath $file.FullName -Raw)).testsuite.testcase) {
                foreach ($bad in @($case.failure) + @($case.error) | Where-Object { $_ }) {
                  $frames = $bad.InnerText -split "`r?`n" |
                    Where-Object { $_ -match '^\s*at .*folderlibrary' } |
                    Select-Object -First 3
                  "[$($case.classname -replace '.*\.', '').$($case.name)] $($bad.type): $($bad.message)"
                  $frames | ForEach-Object { '  ' + $_.Trim() }
                }
              }
            }
            return ($lines -join "`n")
          }

          $failures = Get-TestFailureSummary ".keiyoushi-base/$env:KEIYOUSHI_MODULE/build/test-results"
          $failures = $failures.Substring(0, [Math]::Min(3000, $failures.Length))

          # 测试失败详情优先；剩下的预算留给 Gradle 日志尾部（编译错误只出现在那里）。
          $budget = 4000 - $failures.Length
          $tail = $log.Substring([Math]::Max(0, $log.Length - $budget))
          $report = "=== test failures ===`n$failures`n=== log tail ===`n$tail"
          $escaped = $report.Substring([Math]::Max(0, $report.Length - 4000)).
            Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::error title=Gradle test/build failure::$escaped"
          exit 1

      - name: Collect release APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          $apk = Get-ChildItem -Path '.keiyoushi-base/src/all/folderlibrary/build/outputs/apk/release' -Filter '*.apk' -File |
            Select-Object -First 1
          if (-not $apk) { throw 'Release APK was not produced' }
          # 保留底座生成的 tachiyomi-all.folderlibrary-v<libVersion>.<versionCode>.apk 文件名：
          # 换成固定名就丢了 versionCode，而 Android 拒绝降级安装，分不清版本没法排查。
          $collected = Join-Path 'artifacts' $apk.Name
          Copy-Item -LiteralPath $apk.FullName -Destination $collected -Force
          "RELEASE_APK=$collected" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Resolve apksigner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 不手动装 SDK：AGP 会按底座的 compileSdk 自己下载平台和 build-tools，
          # 版本号写死在这里只会在底座升级时炸掉。挑装好的最高版即可。
          $buildToolsRoot = Join-Path $env:ANDROID_HOME 'build-tools'
          $installed = Get-ChildItem -LiteralPath $buildToolsRoot -Directory |
            Where-Object {
              $_.Name -match '^\d+\.\d+\.\d+' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'apksigner'))
            } |
            Sort-Object -Property @{ Expression = { [version][regex]::Match($_.Name, '^\d+\.\d+\.\d+').Value } } -Descending
          if (-not $installed) { throw "No build-tools under $buildToolsRoot provides apksigner" }

          $apksigner = Join-Path $installed[0].FullName 'apksigner'
          Write-Host "Using apksigner: $apksigner"
          "APKSIGNER=$apksigner" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify release APK signature
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # 密钥随仓库走，签名状态因此是确定的，可以硬断言了。这不是安全检查，是安装前提：
          # Mihon 的 ExtensionLoader 对未签名包直接返回 LoadResult.Error，装不上等于白跑。
          try {
            $verification = & $env:APKSIGNER verify --verbose --print-certs $env:RELEASE_APK 2>&1 | Out-String
            $exitCode = $LASTEXITCODE
            Write-Host $verification
            if ($exitCode -ne 0) { throw "apksigner verify exited $exitCode" }

            # 断言证书指纹而不是 DN。DN 靠不住：apksigner 把 RDN 反序打印
            # （C=CN, O=tpap, CN=Folder Library），且行前缀随 build-tools 版本变
            # （Signer #1 / V2 Signer:）。指纹才是稳定身份，也正是 Mihon 判断信任用的东西。
            # 行首必须放开匹配前缀，但 certificate 这个词不能省——同一份输出里还有
            # public key SHA-256 digest，抓错行就等于什么都没验。
            $found = [regex]::Matches($verification, '(?m)^.*certificate SHA-256 digest: ([0-9a-f]{64})\s*$') |
              ForEach-Object { $_.Groups[1].Value } |
              Select-Object -Unique
            $unexpected = $found | Where-Object { $_ -ne $env:SIGNING_CERT_SHA256 }
            if (-not $found -or $unexpected) {
              throw "expected certificate $env:SIGNING_CERT_SHA256 but found [$($found -join ', ')]"
            }
            Write-Host "Release APK signed by the pinned certificate $env:SIGNING_CERT_SHA256"
          } catch {
            # 终止性错误自己不会留下 ::error，而空消息的 annotation 会被 GitHub 直接丢掉，
            # 日志里就只剩一句 exit code 1（上一版正是这样瞎了一轮）。这层保证失败带着现场出来。
            $reason = $_.Exception.Message -replace '\s*\r?\n\s*', ' '
            Write-Host "::error title=Release APK signature check failed::$reason"
            exit 1
          }

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-folder-library-1.6-apk
          path: artifacts/*.apk
          if-no-files-found: error
