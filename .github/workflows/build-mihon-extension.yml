name: Build Mihon 1.6 Extension

on:
  workflow_dispatch:
  push:
    paths:
      - "mihon/keiyoushi-module/**"
      - ".github/workflows/build-mihon-extension.yml"
  pull_request:
    paths:
      - "mihon/keiyoushi-module/**"
      - ".github/workflows/build-mihon-extension.yml"

permissions:
  contents: read

env:
  KEIYOUSHI_COMMIT: 5083ff5d06b9cb7736216ae0fbd0be3828bcce2c
  KEIYOUSHI_MODULE: src/all/folderlibrary

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Checkout pinned Keiyoushi build base
        uses: actions/checkout@v4
        with:
          repository: keiyoushi/extensions-source
          ref: ${{ env.KEIYOUSHI_COMMIT }}
          path: .keiyoushi-base

      - name: Verify pinned build base
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = git -C '.keiyoushi-base' rev-parse HEAD
          if ($actual -ne $env:KEIYOUSHI_COMMIT) {
            throw "Expected Keiyoushi $env:KEIYOUSHI_COMMIT but checked out $actual"
          }

      - name: Install Folder Library module
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $PWD ".keiyoushi-base/$env:KEIYOUSHI_MODULE"
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          # 官方底座默认用 debug key 签 release。PR 必须产出无生产签名 APK，
          # 受保护分支再由下方 apksigner 使用固定仓库 Secrets 签名。
          $pluginPath = '.keiyoushi-base/gradle/build-logic/src/main/kotlin/ExtensionPlugin.kt'
          $pluginText = Get-Content -LiteralPath $pluginPath -Raw -Encoding UTF8
          # 缩进必须和固定 commit 的原文逐字节一致：底座一改就该报错，而不是静默跳过替换。
          $signingBlock = @'
                              signingConfig = if (rootProject.file("signingkey.jks").exists()) {
                                  signingConfigs.getByName("release")
                              } else {
                                  signingConfigs.getByName("debug")
                              }
          '@
          if (-not $pluginText.Contains($signingBlock)) {
            throw 'Pinned Keiyoushi signing block changed unexpectedly'
          }
          $pluginText = $pluginText.Replace($signingBlock, '                    signingConfig = null')
          Set-Content -LiteralPath $pluginPath -Value $pluginText -Encoding UTF8

          # 官方 core 图标作为本地源的轻量默认图标，避免为低配模块增加额外资源。
          Copy-Item -Path '.keiyoushi-base/core/src/main/res' -Destination (Join-Path $target 'res') -Recurse -Force
          Copy-Item -Path 'mihon/keiyoushi-module/*' -Destination $target -Recurse -Force

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Report and apply Spotless formatting
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          # 本仓库没有 JDK，ktlint 只能在 runner 上跑。把违规详情和补丁提到 annotation 里
          # （匿名可读，job log 不可读），这样源码能在本仓库一次改对，而不是靠 CI 试错。
          $gradlew = Join-Path $PWD '.keiyoushi-base/gradlew'
          $module = ".keiyoushi-base/$env:KEIYOUSHI_MODULE"
          $before = Join-Path $env:RUNNER_TEMP 'spotless-before'
          Copy-Item -LiteralPath $module -Destination $before -Recurse -Force

          $violations = & $gradlew -p '.keiyoushi-base' --no-daemon `
            ":$($env:KEIYOUSHI_MODULE -replace '/', ':'):spotlessCheck" 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'Spotless already clean; nothing to apply.'
            exit 0
          }

          & $gradlew -p '.keiyoushi-base' --no-daemon `
            ":$($env:KEIYOUSHI_MODULE -replace '/', ':'):spotlessApply"
          if ($LASTEXITCODE -ne 0) { throw 'spotlessApply failed' }

          # git diff 有差异时退出码为 1，不能让它把整个 step 判失败：
          # 这一步只负责报告，构建成败由后面的 test/assemble 决定。
          $patch = & git diff --no-index --no-color -- $before $module 2>&1 | Out-String
          $report = "=== spotlessCheck ===`n$violations`n=== patch ===`n$patch"
          Write-Host $report

          # 匿名 Checks API 只暴露 annotation 的前 4096 个解码字符；保留包含补丁的日志尾部。
          $escaped = $report.Substring([Math]::Max(0, $report.Length - 4000)).
            Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::warning title=Spotless violations (fix these in mihon/keiyoushi-module)::$escaped"
          exit 0

      - name: Run MockWebServer tests and unsigned release build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $gradlew = Join-Path $PWD '.keiyoushi-base/gradlew'
          $log = & $gradlew -p '.keiyoushi-base' --no-daemon `
            ':src:all:folderlibrary:testDebugUnitTest' `
            ':src:all:folderlibrary:assembleRelease' 2>&1 | Out-String
          Write-Host $log
          if ($LASTEXITCODE -eq 0) { exit 0 }

          # job log 匿名不可读，失败详情只能走 annotation 带出来。
          # annotation 只有 4096 字符预算。按 XML 结构提取每个用例的类型/消息和自家栈帧，
          # 而不是 grep 出成片上下文——否则一个用例的协程栈就能把其余失败全挤掉。
          function Get-TestFailureSummary($resultsDir) {
            if (-not (Test-Path -LiteralPath $resultsDir)) { return '' }
            $lines = foreach ($file in Get-ChildItem -LiteralPath $resultsDir -Filter '*.xml' -Recurse) {
              foreach ($case in ([xml](Get-Content -LiteralPath $file.FullName -Raw)).testsuite.testcase) {
                foreach ($bad in @($case.failure) + @($case.error) | Where-Object { $_ }) {
                  $frames = $bad.InnerText -split "`r?`n" |
                    Where-Object { $_ -match '^\s*at .*folderlibrary' } |
                    Select-Object -First 3
                  "[$($case.classname -replace '.*\.', '').$($case.name)] $($bad.type): $($bad.message)"
                  $frames | ForEach-Object { '  ' + $_.Trim() }
                }
              }
            }
            return ($lines -join "`n")
          }

          $failures = Get-TestFailureSummary ".keiyoushi-base/$env:KEIYOUSHI_MODULE/build/test-results"
          $failures = $failures.Substring(0, [Math]::Min(3000, $failures.Length))

          # 测试失败详情优先；剩下的预算留给 Gradle 日志尾部（编译错误只出现在那里）。
          $budget = 4000 - $failures.Length
          $tail = $log.Substring([Math]::Max(0, $log.Length - $budget))
          $report = "=== test failures ===`n$failures`n=== log tail ===`n$tail"
          $escaped = $report.Substring([Math]::Max(0, $report.Length - 4000)).
            Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
          Write-Host "::error title=Gradle test/build failure::$escaped"
          exit 1

      - name: Collect unsigned APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Path 'artifacts' -Force | Out-Null
          $apk = Get-ChildItem -Path '.keiyoushi-base/src/all/folderlibrary/build/outputs/apk/release' -Filter '*.apk' -File |
            Select-Object -First 1
          if (-not $apk) { throw 'Unsigned release APK was not produced' }
          Copy-Item -LiteralPath $apk.FullName -Destination 'artifacts/folder-library-1.6-unsigned.apk' -Force

      - name: Resolve apksigner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 不手动装 SDK：AGP 会按底座的 compileSdk 自己下载平台和 build-tools，
          # 版本号写死在这里只会在底座升级时炸掉。挑装好的最高版即可。
          $buildToolsRoot = Join-Path $env:ANDROID_HOME 'build-tools'
          $installed = Get-ChildItem -LiteralPath $buildToolsRoot -Directory |
            Where-Object {
              $_.Name -match '^\d+\.\d+\.\d+' -and (Test-Path -LiteralPath (Join-Path $_.FullName 'apksigner'))
            } |
            Sort-Object -Property @{ Expression = { [version][regex]::Match($_.Name, '^\d+\.\d+\.\d+').Value } } -Descending
          if (-not $installed) { throw "No build-tools under $buildToolsRoot provides apksigner" }

          $apksigner = Join-Path $installed[0].FullName 'apksigner'
          Write-Host "Using apksigner: $apksigner"
          "APKSIGNER=$apksigner" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify unsigned APK
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $verification = & $env:APKSIGNER verify --verbose --print-certs `
            'artifacts/folder-library-1.6-unsigned.apk' 2>&1
          $verificationExitCode = $LASTEXITCODE
          if ($verificationExitCode -eq 0) {
            throw 'PR/release staging APK was unexpectedly signed before the protected-branch step'
          }
          Write-Host 'Unsigned APK verification passed.'

      - name: Sign protected-branch APK
        if: github.event_name == 'push' && github.ref_protected == true
        shell: pwsh
        env:
          MIHON_KEYSTORE_BASE64: ${{ secrets.MIHON_KEYSTORE_BASE64 }}
          MIHON_KEY_ALIAS: ${{ secrets.MIHON_KEY_ALIAS }}
          MIHON_STORE_PASSWORD: ${{ secrets.MIHON_STORE_PASSWORD }}
          MIHON_KEY_PASSWORD: ${{ secrets.MIHON_KEY_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('MIHON_KEYSTORE_BASE64', 'MIHON_KEY_ALIAS', 'MIHON_STORE_PASSWORD', 'MIHON_KEY_PASSWORD')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required signing secret: $name"
            }
          }

          $keystore = Join-Path $env:RUNNER_TEMP 'folder-library.jks'
          [IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:MIHON_KEYSTORE_BASE64))

          & $env:APKSIGNER sign `
            --ks $keystore `
            --ks-key-alias $env:MIHON_KEY_ALIAS `
            --ks-pass 'env:MIHON_STORE_PASSWORD' `
            --key-pass 'env:MIHON_KEY_PASSWORD' `
            --out 'artifacts/folder-library-1.6-signed.apk' `
            'artifacts/folder-library-1.6-unsigned.apk'
          & $env:APKSIGNER verify --verbose --print-certs 'artifacts/folder-library-1.6-signed.apk'

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: mihon-folder-library-1.6-apk
          path: artifacts/*.apk
          if-no-files-found: error
