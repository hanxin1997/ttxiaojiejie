name: Test Server

on:
  workflow_dispatch:
  push:
    paths:
      - "server/**"
      - "tests/**"
      - "benchmarks/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-server.yml"
  pull_request:
    paths:
      - "server/**"
      - "tests/**"
      - "benchmarks/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/test-server.yml"

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      # 本地缺少依赖可显式跳过；CI 必须真正验证 ZIP 和图片处理链路。
      REQUIRE_ARCHIVE_DEPS: "1"
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install server dependencies
        run: npm install --no-audit --no-fund
      - name: Require ZIP and image dependencies
        # 不允许测试在缺少真实解析器或 Sharp 原生模块时悄悄跳过。
        run: node --input-type=module -e "await import('yauzl'); await import('sharp');"
      - name: Run server tests
        run: npm test
      - name: Query performance regression
        run: node benchmarks/catalog-benchmark.mjs
      - name: Writer performance regression
        run: node benchmarks/write-benchmark.mjs
      - name: Scan performance regression
        if: runner.os == 'Linux'
        run: node benchmarks/scan-benchmark.mjs
      - name: Media performance regression
        if: runner.os == 'Linux'
        run: node benchmarks/media-benchmark.mjs
